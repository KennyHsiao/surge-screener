name: Deploy Test Server

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_source_refresh:
        description: Run the long data/Analytics refresh before deployment
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-test-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, surge-screener-test]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy Streamlit app
        env:
          # Deploys stay fast by default. The dedicated data-health timer owns
          # scheduled refreshes; manual dispatch can still opt in explicitly.
          RUN_SOURCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.run_source_refresh && '1' || '0' }}
          RUN_ANALYTICS_REFRESH: "0"
        run: bash scripts/deploy_test_server.sh
