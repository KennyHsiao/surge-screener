name: Deploy Test Server

on:
  push:
    branches: [main]
  schedule:
    # Weekdays 23:55 UTC — catch up test-server reports after report-writing jobs.
    - cron: '55 23 * * 1-5'
  workflow_dispatch:

concurrency:
  group: deploy-test-server
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, linux, x64, surge-screener-test]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Deploy Streamlit app
        run: bash scripts/deploy_test_server.sh
