name: Daily US Surge Screener

# Runs after US market close, scans the universe, runs deep DD on top candidates,
# and pushes results to Telegram. Multi-market via workflow_dispatch inputs.

on:
  schedule:
    # 5:30 PM ET on weekdays = 21:30 UTC (EST) / 22:30 UTC (EDT）)
    - cron: '30 22 * * 1-5'
    # Daily 9:00 AM ET — verify forward returns of past picks
    - cron: '0 13 * * 1-5'
    # 1st of every month, 6:00 AM ET — self-reflection report
    - cron: '0 10 1 * *'
    # 15th of every month, 6:00 AM ET — surge retrospective (ground-truth factor validation)
    - cron: '0 10 15 * *'
    # Daily 00:30 UTC — refresh Binance USDT-perp universe + diff
    - cron: '30 0 * * *'
    # Fri 23:00 UTC = Sat 07:00 Taiwan — COT/ES weekly report
    - cron: '0 23 * * 5'
    # Weekdays 22:00 UTC (after US close, EOD volume final) — unusual options-flow scan
    - cron: '0 22 * * 1-5'
  workflow_dispatch:
    inputs:
      markets:
        description: 'Comma-separated markets to scan'
        type: choice
        options:
          - 'US'
          - 'US,HK'
          - 'US,HK,A'
          - 'US,HK,A,TW'
        default: 'US'
      universe:
        description: 'Universe to scan'
        type: choice
        options:
          - 'sp1500'           # S&P 1500 — fast, broad-enough
          - 'russell3000'      # full US — slower but complete
          - 'nasdaq_only'      # high-beta growth focus
          - 'custom'           # uses STOCKS env var
        default: 'sp1500'
      min_score:
        description: 'Minimum composite score for watchlist'
        type: string
        default: '65'
      run_deep_dd:
        description: 'Run Dexter DD on top candidates'
        type: boolean
        default: true
      manual_job:
        description: 'On a manual run, which job to execute'
        type: choice
        options:
          - 'screener'        # full 5-layer surge screen (default)
          - 'cot'             # COT/ES weekly report only
          - 'crypto'          # refresh crypto universe only
          - 'retrospective'   # surge retrospective / factor validation
          - 'options_flow'    # unusual options-flow scan + Telegram alerts
          - 'reversal'        # 反轉雷達 scan + Telegram + forward validation (standalone test)
        default: 'screener'

# GITHUB_TOKEN scope for every job: contents:write so the bot can commit reports back.
# Repo-level default is read-only → push 403 without this. Minimal: ONLY contents write.
permissions:
  contents: write

jobs:
  surge_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # EOD screening cron, or a manual run with manual_job=screener (the default)
    if: github.event.schedule == '30 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.manual_job == 'screener')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install yfinance sec-edgar-downloader

      - name: Configure run parameters
        id: config
        run: |
          # On scheduled runs, inputs are empty — use defaults
          MARKETS="${{ github.event.inputs.markets || 'US' }}"
          UNIVERSE="${{ github.event.inputs.universe || 'sp1500' }}"
          MIN_SCORE="${{ github.event.inputs.min_score || '65' }}"
          RUN_DD="${{ github.event.inputs.run_deep_dd || 'true' }}"

          echo "markets=$MARKETS" >> $GITHUB_OUTPUT
          echo "universe=$UNIVERSE" >> $GITHUB_OUTPUT
          echo "min_score=$MIN_SCORE" >> $GITHUB_OUTPUT
          echo "run_dd=$RUN_DD" >> $GITHUB_OUTPUT

          echo "::notice::Run config — markets=$MARKETS universe=$UNIVERSE min_score=$MIN_SCORE dd=$RUN_DD"

      - name: Stage 1 — Hard filter universe
        env:
          MARKETS: ${{ steps.config.outputs.markets }}
          UNIVERSE: ${{ steps.config.outputs.universe }}
        run: |
          # Pulls universe, applies the 6 hard filters from the screener prompt.
          # Outputs filtered_universe.json — typically 300-600 tickers.
          python scripts/01_hard_filter.py \
            --markets "$MARKETS" \
            --universe "$UNIVERSE" \
            --output filtered_universe.json

      - name: Stage 2 — LLM scoring with screener prompt (Layer 0 + Layer 1)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY:  ${{ secrets.DEEPSEEK_API_KEY }}
          # Data providers
          POLYGON_API_KEY:   ${{ secrets.POLYGON_API_KEY }}
          FINNHUB_API_KEY:   ${{ secrets.FINNHUB_API_KEY }}
          # Sentiment
          X_BEARER_TOKEN:    ${{ secrets.X_BEARER_TOKEN }}
          # Options flow & smart money (Dimension 6)
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
        run: |
          # Layer 0: Base Prompter — runs once, computes regime context
          # Layer 1: Breadth Pass — scores each candidate on 6 dimensions
          # Outputs scored_candidates.json with regime_context attached
          python scripts/02_llm_score.py \
            --input filtered_universe.json \
            --prompt system_prompts/01_surge_screener_prompt.md \
            --min-score ${{ steps.config.outputs.min_score }} \
            --provider anthropic \
            --model claude-opus-4-8 \
            --output scored_candidates.json

      - name: Stage 2.5 — Engine Controller (Layer 2, DEoT routing)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          POLYGON_API_KEY:   ${{ secrets.POLYGON_API_KEY }}
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
          X_BEARER_TOKEN:    ${{ secrets.X_BEARER_TOKEN }}
        run: |
          # For each candidate flagged NEEDS_LAYER_2:
          #   - Engine Controller decides BREADTH / DEPTH / TERMINATE
          #   - Execute the chosen action (additional LLM call)
          #   - Loop max 2 layers, max 6 nodes per candidate
          #   - Track Effective Reasoning Information Rate (ERIR)
          # Outputs layer2_results.json — tree-structured analysis per candidate
          python scripts/025_engine_controller.py \
            --input scored_candidates.json \
            --controller-prompt system_prompts/04_engine_controller_prompt.md \
            --max-layers 2 \
            --max-nodes-per-candidate 6 \
            --provider anthropic \
            --model claude-opus-4-8 \
            --output layer2_results.json

      - name: Stage 3 — Dexter deep due diligence (Layer 3, US only)
        if: steps.config.outputs.run_dd == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
          X_BEARER_TOKEN:    ${{ secrets.X_BEARER_TOKEN }}
          EXA_API_KEY:       ${{ secrets.EXA_API_KEY }}
          # Options flow verification step
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
        run: |
          # Filters Layer 2 output to candidates with verdict CONTINUE_TO_DD
          # Invokes Dexter with skills/02_dexter_due_diligence_skill.md per candidate
          # Outputs dd_results.json
          python scripts/03_deep_dd.py \
            --input layer2_results.json \
            --skill skills/02_dexter_due_diligence_skill.md \
            --max-candidates 10 \
            --us-only \
            --output dd_results.json

      - name: Stage 4 — Final Response Agent (Layer 4) + report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Final Response Agent consolidates Layer 0/1/2/3 outputs into:
          # - Ranked final picks with reasoning trees (not just scores)
          # - Suggested entry/stop/size per pick
          # - Cross-candidate market commentary
          # Writes reports/YYYY-MM-DD/ folder with summary.md, full.json, trees.md
          python scripts/04_build_report.py \
            --regime layer2_results.json \
            --screener scored_candidates.json \
            --layer2 layer2_results.json \
            --dd dd_results.json \
            --output-dir "reports/$(date -u +%Y-%m-%d)"

      - name: Stage 5 — Push to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/05_notify.py \
            --report "reports/$(date -u +%Y-%m-%d)/summary.md" \
            --max-tickers 5 \
            --include-charts true

      - name: Stage 6 — Append picks to Performance Ledger
        run: |
          # Adds today's CONFIRMED picks to reports/performance_ledger.csv
          # Forward returns will be filled in by the verify_returns job over coming days
          python scripts/06_append_ledger.py \
            --report "reports/$(date -u +%Y-%m-%d)/summary.json" \
            --ledger reports/performance_ledger.csv

      - name: Stage 6.5 — Snapshot ATM IV (build IV-Rank history)
        # Records today's real ATM IV per candidate into reports/iv_history/ so the
        # 52-week base accumulates. Until enough days exist the momentum-options page
        # uses a realized-vol proxy and will NOT issue IVP-based GO decisions.
        continue-on-error: true
        run: |
          python scripts/snapshot_iv.py

      - name: Stage 6.6 — Forward snapshot for surge retrospective
        # Append EVERY scored candidate (not just BUY picks) to
        # reports/retrospective/forward_snapshots.csv. Breaks the ledger's
        # selection bias and is the only free way to accumulate historical Dim3
        # (sentiment) + Dim6 (options flow) — retro_forward_lift validates them
        # after ~60-90 days. Idempotent (dedup on scan_date+ticker).
        continue-on-error: true
        run: |
          python scripts/retro_snapshot.py --input scored_candidates.json

      - name: Stage 6.7 — Oversold-reversal lane scan + forward validation
        # Scans the FULL pre-filter universe for the retro's one VALIDATED archetype
        # (超賣反轉, lift 4.17) — the oversold-reversal setups the 200DMA hard filter
        # rejects. Dated scan_*.json accumulate as forward snapshots; the forward step
        # measures realized hit-rate per tier (PROVISIONAL until 100 resolve).
        # reports/oversold_reversal/ is committed by the step below (git add reports/).
        continue-on-error: true
        run: |
          python scripts/oversold_reversal_scan.py --universe sp1500
          python scripts/oversold_reversal_forward.py || true

      - name: Stage 6.8 — Reversal Radar scan + notify + forward validation
        # 反轉雷達 (inverse of Risk Guard): pre-screens sp1500 for BEATEN-DOWN names showing
        # EARLY reversal signs, full-scores them, pushes TURNING+ alerts to Telegram (silent-
        # skip if creds absent; a notify glitch never fails the scan), and accumulates dated
        # scan_*.json for forward validation. Reversal factors are EXPLORATORY until
        # reversal_radar_forward matures (PROVISIONAL until 100 resolve per tier). Reports
        # committed by the step below (reports/reversal_radar/ is NOT gitignored).
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/reversal_radar_scan.py --universe beaten_down --notify
          python scripts/reversal_radar_forward.py || true

      - name: Commit reports back to repo
        # Persists daily reports (incl. iv_history/) for backtesting
        run: |
          git config user.name  "surge-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/
          git diff --staged --quiet || (git commit -m "report: $(date -u +%Y-%m-%d)" && git push)

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surge-scan-${{ github.run_id }}
          path: |
            filtered_universe.json
            scored_candidates.json
            layer2_results.json
            dd_results.json
            reports/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # Daily morning job — fill in forward returns for past picks
  # ──────────────────────────────────────────────────────────────
  verify_returns:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 13 * * 1-5'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt yfinance pandas

      - name: Update forward returns in ledger
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          # For each past pick, fill in fwd_3d / fwd_7d / fwd_14d / fwd_30d / fwd_60d
          # Mark hit_15pct_within_30d and hit_30pct_within_60d flags.
          python scripts/07_verify_returns.py \
            --ledger reports/performance_ledger.csv \
            --provider polygon

      - name: Commit updated ledger
        run: |
          git config user.name  "surge-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/performance_ledger.csv
          git diff --staged --quiet || (git commit -m "ledger update: $(date -u +%Y-%m-%d)" && git push)

  # ──────────────────────────────────────────────────────────────
  # Monthly self-reflection — agent audits its own predictions
  # ──────────────────────────────────────────────────────────────
  monthly_reflection:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 10 1 * *'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Run self-reflection skill
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Loads skills/05_self_reflection_skill.md
          # Reads reports/performance_ledger.csv for last 30/60/90 days
          # Outputs reports/reflections/YYYY-MM.md with audit + suggested changes
          python scripts/08_self_reflection.py \
            --skill skills/05_self_reflection_skill.md \
            --ledger reports/performance_ledger.csv \
            --lookback-days 30 \
            --output "reports/reflections/$(date -u +%Y-%m).md" \
            --provider anthropic \
            --model claude-opus-4-8

      - name: Commit reflection report
        run: |
          git config user.name  "surge-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/reflections/
          git diff --staged --quiet || (git commit -m "reflection: $(date -u +%Y-%m)" && git push)

      - name: Push reflection summary to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/09_notify_reflection.py \
            --report "reports/reflections/$(date -u +%Y-%m).md"

  # ──────────────────────────────────────────────────────────────
  # Monthly surge retrospective — mine stocks that ACTUALLY surged and
  # measure which scoring sub-factors really preceded them (ground truth,
  # not the screener's own picks). Output is for human review, never auto-tuned.
  # ──────────────────────────────────────────────────────────────
  monthly_retrospective:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    if: github.event.schedule == '0 10 15 * *' || (github.event_name == 'workflow_dispatch' && inputs.manual_job == 'retrospective')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Run surge retrospective (label → reconstruct → EDGAR → lift → report)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: |
          # Scans S&P 1500 over 2y for real surges (multi-threshold), reconstructs
          # pre-surge Dim1/Dim5 factors at the confirmation day, backfills Dim2 (8-K)
          # + Dim4 (insider buys) from SEC EDGAR (free historical), computes lift vs a
          # control group (pure numpy — no scipy), and synthesizes a human-review
          # report mapped to system_prompts/01_surge_screener_prompt.md.
          # Caching (reports/.cache) keeps re-fetches cheap; never blocks the daily pipeline.
          python scripts/retro_surge_label.py --universe sp1500 --lookback-days 730
          python scripts/retro_reconstruct.py
          python scripts/retro_edgar_backfill.py
          python scripts/retro_factor_lift.py
          # Module (factor-combination) validation — reuses the control set
          # retro_factor_lift just persisted; no extra fetching.
          python scripts/retro_modules.py
          python scripts/retro_report.py \
            --provider anthropic \
            --model claude-opus-4-8
          # Phase 2: once forward_snapshots.csv has ~60+ days, validate Dim3/Dim6 too.
          # No-ops cleanly while still accumulating.
          python scripts/retro_forward_lift.py || true

      - name: Re-validate survivorship-corrected universe (sp500_pit)
        id: pit_revalidate
        # Best-effort: the pass above scans the CURRENT S&P 1500 (survivorship-biased —
        # "joined-after-surging"). This leg re-runs the POINT-IN-TIME S&P 500
        # (scripts/sp500_membership.py snapshot) so the knowledge cards below sync from the
        # survivorship-corrected validation, not the biased sp1500 one. It stays BLOCKED
        # (the delisted-survivor gap is free-unfixable) — its value is the runway-neutral
        # verdicts. continue-on-error so a scan/network failure can NEVER block the proven
        # sp1500 report. If it does NOT fully succeed, the sync step below is SKIPPED (gated
        # on this step's outcome) so the last-committed, mutually-consistent PIT cards remain
        # untouched — never re-stamped from a half-written artifact set (adversarial review).
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ secrets.SEC_EDGAR_USER_AGENT }}
        run: |
          # Every output is routed EXPLICITLY into the sp500_pit/ dataset dir (the scripts
          # default to the root dir — they do not auto-route by --universe). --no-llm on the
          # report: a blocked run never calls the LLM anyway, so this is deterministic + free.
          set -euo pipefail
          PIT=reports/retrospective/sp500_pit
          python scripts/retro_surge_label.py --universe sp500_pit --lookback-days 730 \
            --output $PIT/surge_events.json
          python scripts/retro_reconstruct.py \
            --events $PIT/surge_events.json --output $PIT/surge_features.json
          python scripts/retro_edgar_backfill.py --features $PIT/surge_features.json
          python scripts/retro_factor_lift.py \
            --events $PIT/surge_events.json --features $PIT/surge_features.json \
            --output $PIT/factor_lift.json
          python scripts/retro_modules.py \
            --features $PIT/surge_features.json --controls $PIT/control_features.json \
            --lift $PIT/factor_lift.json --output $PIT/module_lift.json
          python scripts/retro_report.py --lift $PIT/factor_lift.json --no-llm

      - name: Close the knowledge loop (sync factor cards from sp500_pit)
        # ONLY runs when the re-validation above FULLY succeeded (outcome == success, before
        # continue-on-error masks it) — so the cards are only re-stamped from a complete,
        # mutually-consistent sp500_pit artifact set, never a half-written one from a mid-leg
        # crash (adversarial review: fresh-events + stale-lift would otherwise poison cards).
        # On a failed re-validation this is SKIPPED → the last-committed cards stand.
        # knowledge_sync ALSO source-chain-validates (events_generated_at) as defence in depth.
        id: knowledge_loop
        if: steps.pit_revalidate.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          PIT=reports/retrospective/sp500_pit
          python scripts/retro_runway_neutral_check.py $PIT --json $PIT/runway_neutral.json
          python scripts/lane_runway_check.py $PIT --json $PIT/lane_runway.json
          python scripts/knowledge_sync.py --lift $PIT/factor_lift.json --events $PIT/surge_events.json
          python scripts/knowledge_runway_sync.py

      - name: Reversal radar calibration (per-signal forward lift)
        # Monthly accuracy-loop step for the PURE-RULES reversal radar: attribute the forward
        # hit-rate BY SIGNAL across the accumulated reports/reversal_radar/scan_*.json so a human
        # can see which flags carry predictive weight and hand-tune reversal_radar.py's weights.
        # PROVISIONAL until the forward sample matures; NEVER auto-tunes. Best-effort, no LLM,
        # no secrets — never blocks the retrospective.
        continue-on-error: true
        run: python scripts/reversal_radar_calibrate.py || true

      - name: Commit retrospective report + synced factor cards
        env:
          # ALL-OR-NOTHING: publish sp500_pit/ + knowledge/ only when BOTH the PIT re-validation
          # AND the knowledge-loop (sync + runway-sync) FULLY succeeded — else a runway-sync
          # failure after knowledge_sync wrote cards would commit half-stamped cards (Codex re-review).
          PIT_OK: ${{ steps.pit_revalidate.outcome == 'success' && steps.knowledge_loop.outcome == 'success' }}
        run: |
          git config user.name  "surge-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          # ALWAYS commit the proven sp1500 root retrospective (root-level files only).
          git add reports/retrospective/*.json reports/retrospective/*.md 2>/dev/null || true
          # Commit the sp500_pit re-validation + synced cards ONLY if BOTH PIT legs FULLY
          # succeeded — a partial (half-written) PIT run must never be published; discard its
          # partial outputs so the last-committed, consistent state is retained (Codex review).
          if [ "$PIT_OK" = "true" ]; then
            git add reports/retrospective/sp500_pit/ knowledge/
          else
            echo "::warning::PIT re-validation did not fully succeed — discarding partial sp500_pit/ + knowledge/ and keeping the last-committed state."
            git checkout -- reports/retrospective/sp500_pit/ knowledge/ 2>/dev/null || true
            git clean -fdq reports/retrospective/sp500_pit/ 2>/dev/null || true
          fi
          # Reversal-radar monthly calibration outputs (best-effort; independent of PIT gating).
          git add reports/reversal_radar/calibration.json reports/reversal_radar/calibration.md 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "retrospective + factor-card sync: $(date -u +%Y-%m-%d)" && git push)

  # ──────────────────────────────────────────────────────────────
  # Daily — refresh Binance USDT-perp universe and diff vs yesterday
  # ──────────────────────────────────────────────────────────────
  crypto_universe:
    runs-on: ubuntu-latest
    if: github.event.schedule == '30 0 * * *' || (github.event_name == 'workflow_dispatch' && inputs.manual_job == 'crypto')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Refresh crypto universe
        # No API key needed — Binance exchangeInfo is public.
        run: python scripts/crypto_universe.py --output-dir reports/crypto

      - name: Commit crypto universe
        run: |
          git config user.name  "surge-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/crypto/
          git diff --staged --quiet || (git commit -m "crypto universe: $(date -u +%Y-%m-%d)" && git push)

  # ──────────────────────────────────────────────────────────────
  # Weekly (Sat 07:00 Taiwan) — COT/ES report from verified data
  # ──────────────────────────────────────────────────────────────
  cot_es:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 23 * * 5' || (github.event_name == 'workflow_dispatch' && inputs.manual_job == 'cot')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Generate COT/ES weekly report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # CFTC COT (free) + yfinance ES=F (free) → verified data → Claude.
          # Exits non-zero with the failure message if price can't be verified.
          python scripts/cot_es.py \
            --prompt system_prompts/07_cot_es_analyst_prompt.md \
            --model claude-opus-4-8 \
            --output-dir reports/cot

      - name: Commit COT report
        run: |
          git config user.name  "surge-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/cot/
          git diff --staged --quiet || (git commit -m "cot report: $(date -u +%Y-%m-%d)" && git push)

  # ──────────────────────────────────────────────────────────────
  # Unusual options-flow scan — bullflow-style alerts from the free yfinance
  # chain (V/OI spike + skew + est notional). UW-ready: uses the paid Unusual
  # Whales feed automatically when UNUSUAL_WHALES_API_KEY is set.
  # ──────────────────────────────────────────────────────────────
  options_flow_scan:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 22 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.manual_job == 'options_flow')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Scan unusual options flow + push Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UNUSUAL_WHALES_API_KEY: ${{ secrets.UNUSUAL_WHALES_API_KEY }}
        run: |
          # Free yfinance: unusual VOLUME (V/OI spike + call/put skew + est notional).
          # Curated liquid universe + the day's scored candidates; pushes top signals
          # to Telegram as bullflow-style posts. main() returns 0 for all expected
          # outcomes (no signals / no Telegram creds), so a non-zero exit here is a
          # REAL crash worth surfacing — no `|| true` masking it.
          python scripts/options_flow_scan.py --notify --sleep 0.2

      - name: Commit options flow
        run: |
          git config user.name  "surge-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/options_flow/
          git diff --staged --quiet || (git commit -m "options flow: $(date -u +%Y-%m-%d)" && git push)

  reversal_radar:
    runs-on: ubuntu-latest
    # STANDALONE manual test path for the 反轉雷達 (the SCHEDULED run is inline in surge_scan
    # Stage 6.8 — keep them in sync). Dispatch-only so it never double-runs on the schedule.
    # Run via: Actions → Run workflow → manual_job=reversal.
    if: github.event_name == 'workflow_dispatch' && inputs.manual_job == 'reversal'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Reversal Radar scan + notify + forward validation
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # 反轉雷達: pre-screen beaten-down sp1500 → score → Telegram (TURNING+) + forward.
          # --prescreen-cap bounds the manual-test runtime; the scan never fails on a notify
          # glitch (silent-skip if TELEGRAM_* unset). EXPLORATORY until the forward matures.
          python scripts/reversal_radar_scan.py --universe beaten_down --notify --prescreen-cap 300
          python scripts/reversal_radar_forward.py || true

      - name: Commit reversal radar
        run: |
          git config user.name  "surge-screener-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/reversal_radar/
          git diff --staged --quiet || (git commit -m "reversal radar: $(date -u +%Y-%m-%d)" && git push)
