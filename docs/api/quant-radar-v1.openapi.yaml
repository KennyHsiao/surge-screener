          type: string
          maxLength: 15
          pattern: "^[A-Z0-9]+(?:[.-][A-Z0-9]+)*$"
        series:
          type: object
          propertyNames:
            format: date
          additionalProperties:
            type: number
            exclusiveMinimum: 0
            exclusiveMaximum: 10
      additionalProperties: false
    FundCatalogData:
      type: object
      description: Strict public projection of the curated fund catalog.
      required: [funds]
      properties:
        funds:
          type: object
          maxProperties: 100
          propertyNames:
            type: string
            minLength: 1
            maxLength: 120
            pattern: '^\S(?:.*\S)?$'
          additionalProperties:
            $ref: "#/components/schemas/FundCatalogEntry"
      additionalProperties: false
    FundCatalogEntry:
      type: object
      required: [cik, note]
      properties:
        cik:
          type: string
          minLength: 1
          maxLength: 10
          pattern: "^0*[1-9][0-9]*$"
        note:
          type: string
          maxLength: 200
      additionalProperties: false
    AiUpdatesData:
      type: object
      description: Strict public projection of the manually maintained update feed.
      required: [updates]
      properties:
        updates:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/AiUpdateItem"
      additionalProperties: false
    AiUpdateItem:
      type: object
      description: One source-ordered public AI update entry.
      required: [date, title, summary, link, tags]
      properties:
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Real calendar date preserved as the original YYYY-MM-DD string.
        title:
          type: string
          minLength: 1
          maxLength: 200
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        link:
          type: string
          maxLength: 2048
          description: |
            Empty or a lowercase-HTTPS IRI preserved exactly as stored. Runtime
            parsing additionally requires a valid non-empty authority and hostname,
            rejects userinfo and invalid ports, and performs no normalization. Those
            parser-enforced checks are intentionally stricter than this schema
            pattern.
          anyOf:
            - const: ""
            - type: string
              format: iri
              pattern: '^https://[^/@?#\s\x00-\x1f\x7f]+(?:[/?#][^\s\x00-\x1f\x7f]*)?$'
        tags:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 50
            pattern: '^\S(?:[\s\S]*\S)?$'
      additionalProperties: false
    SchedulesData:
      type: object
      description: Strict public projection of the manually maintained schedule registry.
      required: [schedules]
      properties:
        schedules:
          type: array
          maxItems: 100
          description: |
            Source-ordered schedule entries. Schedule IDs must be unique at
            runtime; JSON Schema cannot enforce uniqueness by one object property.
          items:
            $ref: "#/components/schemas/ScheduleEntry"
      additionalProperties: false
    ScheduleEntry:
      type: object
      description: One source-ordered public schedule-registry entry.
      required: [id, name, category, cron, cron_note, description, result_type]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
          description: Identifier that is unique within the artifact at runtime.
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^\S(?:[\s\S]*\S)?$'
        category:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^\S(?:[\s\S]*\S)?$'
        cron:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^\S(?:[\s\S]*\S)?$'
          description: Opaque source string; the API does not parse cron semantics.
        cron_note:
          type: string
          maxLength: 500
          pattern: '^(?:|\S(?:[\s\S]*\S)?)$'
        description:
          type: string
          maxLength: 2000
          pattern: '^(?:|\S(?:[\s\S]*\S)?)$'
        result_type:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$'
          description: Opaque result identifier that this endpoint never dereferences.
      additionalProperties: false
    ObjectList:
      type: array
      items:
        $ref: "#/components/schemas/JsonObject"
    JsonObject:
      type: object
      description: |
        Nested artifact records remain source-shaped in the local compatibility
        batch. A field-level public DTO is required before non-loopback exposure.
      additionalProperties: true
    KnowledgeGraphData:
      type: object
      additionalProperties: false
      required: [nodes, edges, diagnostics]
      properties:
        nodes:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/KnowledgeGraphNode"
        edges:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/KnowledgeGraphEdge"
        diagnostics:
          $ref: "#/components/schemas/KnowledgeGraphDiagnostics"
    KnowledgeGraphNode:
      type: object
      additionalProperties: false
      required: [id, label, type, dimension, horizon, status, blocked, lift_exploratory, runway_verdict, verdict_raw]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 200
        label:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [dimension, factor, paper, moc, note]
        dimension:
          type: string
          enum: ["", Dim1, Dim2, Dim3, Dim4, Dim5, Dim6, Dim7, meta, framework]
        horizon:
          type: string
          enum: ["", short, mid, long, na]
        status:
          type: string
          enum: [validated, exploratory, weak, noise, contrarian, seed, index]
        blocked:
          type: boolean
        lift_exploratory:
          anyOf:
            - type: number
              minimum: -1000000
              maximum: 1000000
            - type: "null"
        runway_verdict:
          type: string
          enum: ["", exploratory]
        verdict_raw:
          type: string
          enum: ["", VALIDATED, WEAK, NOISE, CONTRARIAN]
    KnowledgeGraphEdge:
      type: object
      additionalProperties: false
      required: [source, target, type]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 200
        target:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          enum: [belongs_to_dimension, evidence, references, index_link]
    KnowledgeGraphDiagnostics:
      type: object
      additionalProperties: false
      required: [unresolved_links, duplicate_ids]
      properties:
        unresolved_links:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/KnowledgeGraphUnresolvedLink"
        duplicate_ids:
          type: array
          maxItems: 0
          items:
            type: string
            minLength: 1
            maxLength: 200
    KnowledgeGraphUnresolvedLink:
      type: object
      additionalProperties: false
      required: [source, target]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 200
        target:
          type: string
          minLength: 1
          maxLength: 200
    ThemeTaxonomyData:
      type: object
      additionalProperties: false
      required: [themes]
      properties:
        themes:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/ThemeTaxonomyItem"
    ThemeTaxonomyItem:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
    ThemeDrillData:
      type: object
      additionalProperties: false
      required: [sectors]
      properties:
        sectors:
          type: array
          maxItems: 11
          items:
            $ref: "#/components/schemas/ThemeDrillSector"
    ThemeDrillSector:
      type: object
      additionalProperties: false
      required: [etf, themes]
      properties:
        etf:
          type: string
          enum: [XLB, XLC, XLE, XLF, XLI, XLK, XLP, XLRE, XLU, XLV, XLY]
        themes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 200
            pattern: '^[^\x00-\x08\x0b\x0c\x0e-\x1f\x7f]+$'
    InfluencerRosterData:
      type: object
      additionalProperties: false
      required: [categories, influencers]
      properties:
        categories:
          type: array
          maxItems: 1000
          items:
            type: string
            minLength: 1
            maxLength: 200
        influencers:
          type: array
          maxItems: 1000
          items:
            $ref: "#/components/schemas/InfluencerRosterItem"
    InfluencerRosterItem:
      type: object
      additionalProperties: false
      required: [handle, category, market]
      properties:
        handle:
          type: string
          pattern: '^[A-Za-z0-9_]{1,15}$'
        name:
          anyOf:
            - type: string
              maxLength: 200
            - type: "null"
        category:
          type: string
          minLength: 1
          maxLength: 200
        market:
          type: string
          enum: [US, CRYPTO]
        note:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
        url:
          anyOf:
            - type: string
              format: uri
              maxLength: 500
              pattern: '^https://[^\s\x00-\x1f\x7f]+$'
            - type: "null"
        category_source:
          anyOf:
            - type: string
              maxLength: 200
            - type: "null"
        category_reason:
          anyOf:
            - type: string
              maxLength: 2000
            - type: "null"
        category_confidence:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
        placeholder:
          type: boolean
          default: false
    IndustryRoleActionRequest:
      oneOf:
        - $ref: "#/components/schemas/IndustryRoleGenerateAction"
        - $ref: "#/components/schemas/IndustryRoleApproveAction"
        - $ref: "#/components/schemas/IndustryRoleRejectAction"
        - $ref: "#/components/schemas/IndustryRoleDeferAction"
      discriminator:
        propertyName: action
        mapping:
          generate: "#/components/schemas/IndustryRoleGenerateAction"
          approve: "#/components/schemas/IndustryRoleApproveAction"
          reject: "#/components/schemas/IndustryRoleRejectAction"
          defer: "#/components/schemas/IndustryRoleDeferAction"
    IndustryRoleGenerateAction:
      type: object
      additionalProperties: false
      required: [action, tickers]
      properties:
        action:
          type: string
          const: generate
        tickers:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          items:
            $ref: "#/components/schemas/IndustryRoleTicker"
    IndustryRoleApproveAction:
      type: object
      additionalProperties: false
      required: [action, ticker, primaryRole, secondaryRoles]
      properties:
        action:
          type: string
          const: approve
        ticker:
          $ref: "#/components/schemas/IndustryRoleTicker"
        primaryRole:
          $ref: "#/components/schemas/IndustryRoleId"
        secondaryRoles:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/IndustryRoleId"
    IndustryRoleRejectAction:
      type: object
      additionalProperties: false
      required: [action, ticker]
      properties:
        action:
          type: string
          const: reject
        ticker:
          $ref: "#/components/schemas/IndustryRoleTicker"
    IndustryRoleDeferAction:
      type: object
      additionalProperties: false
      required: [action, ticker]
      properties:
        action:
          type: string
          const: defer
        ticker:
          $ref: "#/components/schemas/IndustryRoleTicker"
    IndustryRoleMutationResult:
      type: object
      additionalProperties: false
      required: [operator, action, ticker, transactionId, revision, replayed]
      properties:
        operator:
          type: string
          const: operator
        action:
          type: string
          enum: [generate, approve, reject, defer]
        ticker:
          anyOf:
            - $ref: "#/components/schemas/IndustryRoleTicker"
            - type: "null"
        transactionId:
          type: string
          minLength: 36
          maxLength: 36
          format: uuid
        revision:
          type: integer
          minimum: 1
        replayed:
          type: boolean
    IndustryRoleReviewBoardData:
      type: object
      additionalProperties: false
      required: [operator, taxonomy_version, generated_at, roles, approved, suggestions]
      properties:
        operator:
          type: string
          const: operator
        taxonomy_version:
          type: integer
          minimum: 1
          maximum: 1000000
        generated_at:
          anyOf:
            - $ref: "#/components/schemas/IndustryRoleTimestamp"
            - type: "null"
        roles:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/IndustryRoleDefinition"
        approved:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/IndustryRoleApprovedAssignment"
        suggestions:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/IndustryRoleSuggestion"
    IndustryRoleDefinition:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/IndustryRoleId"
        name:
          type: string
          minLength: 1
          maxLength: 200
    IndustryRoleApprovedAssignment:
      type: object
      additionalProperties: false
      required: [ticker, primary_role, secondary_roles, confidence, reviewed_at]
      properties:
        ticker:
          $ref: "#/components/schemas/IndustryRoleTicker"
        primary_role:
          $ref: "#/components/schemas/IndustryRoleId"
        secondary_roles:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/IndustryRoleId"
        confidence:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1
            - type: "null"
        reviewed_at:
          anyOf:
            - $ref: "#/components/schemas/IndustryRoleTimestamp"
            - type: "null"
    IndustryRoleSuggestion:
      type: object
      additionalProperties: false
      required: [ticker, suggested_primary_role, suggested_primary_role_name, suggested_secondary_roles, confidence, evidence, status, reviewed_at]
      properties:
        ticker:
          $ref: "#/components/schemas/IndustryRoleTicker"
        suggested_primary_role:
          $ref: "#/components/schemas/IndustryRoleId"
        suggested_primary_role_name:
          anyOf:
            - type: string
              minLength: 1
              maxLength: 200
            - type: "null"
        suggested_secondary_roles:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/IndustryRoleId"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        evidence:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 1000
        status:
          type: string
          enum: [suggested, approved, rejected, deferred]
        reviewed_at:
          anyOf:
            - $ref: "#/components/schemas/IndustryRoleTimestamp"
            - type: "null"
    IndustryRoleId:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9_]*$'
    IndustryRoleTicker:
      type: string
      minLength: 1
      maxLength: 15
      pattern: '^[A-Z0-9]+(?:[.-][A-Z0-9]+)*$'
    IndustryRoleTimestamp:
      type: string
      minLength: 20
      maxLength: 32
      format: date-time
      pattern: '^\d{4}-\d{2}-\d{2}[Tt](?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,6})?(?:[Zz]|[+-](?:[01]\d|2[0-3]):[0-5]\d)(?![\s\S])'
    ArtifactMeta:
      type: object
      additionalProperties: false
      required: [sourceId, asOf, generatedAt]
      properties:
        sourceId:
          type: string
          description: Stable registry identifier; never a filesystem path.
          pattern: "^[a-z0-9]+(?:[.-][a-z0-9]+)*$"
        asOf:
          type: [string, "null"]
          format: date
        generatedAt:
          type: [string, "null"]
          format: date-time
    Problem:
      type: object
      description: RFC 9457 problem details for unexpected server failures.
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
