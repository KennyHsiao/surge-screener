    MarketThesisValidationData:
      type: object
      additionalProperties: false
      description: Strict public Market Thesis validation scoreboard projection.
      required:
        - validation_status
        - resolved
        - matured
        - min_resolved_for_verdict
        - reject_count
        - invalid_count
        - by_key
      properties:
        validation_status:
          type: string
          minLength: 2
          maxLength: 100
          pattern: '^(?:ok|non_publishable_[a-z0-9_]+)$'
        resolved: {type: integer, minimum: 0, maximum: 1000000}
        matured: {type: integer, minimum: 0, maximum: 1000000}
        min_resolved_for_verdict:
          type: integer
          minimum: 1
          maximum: 1000000
        reject_count: {type: integer, minimum: 0, maximum: 1000000}
        invalid_count: {type: integer, minimum: 0, maximum: 1000000}
        by_key:
          type: object
          maxProperties: 27
          propertyNames:
            pattern: '^(?:看多|看空|盤整)\|(?:short|mid|long)\|(?:analog_supported|event_only|regime_only)$'
          additionalProperties:
            $ref: "#/components/schemas/MarketThesisValidationRow"
    MarketThesisValidationRow:
      type: object
      additionalProperties: false
      required: [counted_N, hits, hit_rate, wilson90, verdict]
      properties:
        counted_N: {type: integer, minimum: 1, maximum: 1000000}
        hits: {type: integer, minimum: 0, maximum: 1000000}
        hit_rate: {type: number, minimum: 0, maximum: 1}
        wilson90:
          type: array
          minItems: 2
          maxItems: 2
          items: {type: number, minimum: 0, maximum: 1}
        verdict:
          type: string
          enum: [PROVISIONAL, MATURE]
    MarketThesisRegimeHistoryData:
      type: object
      additionalProperties: false
      description: Summary-only Market Thesis regime-history projection.
      required: [regime_summary]
      properties:
        regime_summary:
          $ref: "#/components/schemas/MarketThesisRegimeSummary"
    MarketThesisRegimeSummary:
      type: object
      additionalProperties: false
      required: [rally, correction, range]
      properties:
        rally: {$ref: "#/components/schemas/MarketThesisRegime"}
        correction: {$ref: "#/components/schemas/MarketThesisRegime"}
        range: {$ref: "#/components/schemas/MarketThesisRegime"}
    MarketThesisRegime:
      type: object
      additionalProperties: false
      required: [days, fwd_20d, fwd_40d, fwd_60d]
      properties:
        days: {type: integer, minimum: 1, maximum: 100000}
        fwd_20d: {$ref: "#/components/schemas/MarketThesisRegimeWindow"}
        fwd_40d: {$ref: "#/components/schemas/MarketThesisRegimeWindow"}
        fwd_60d: {$ref: "#/components/schemas/MarketThesisRegimeWindow"}
    MarketThesisRegimeWindow:
      type: object
      additionalProperties: false
      required: [mean, up_rate, p10, worst]
      properties:
        mean: {type: number, minimum: -100, maximum: 100}
        up_rate: {type: number, minimum: 0, maximum: 1}
        p10: {type: number, minimum: -100, maximum: 100}
        worst: {type: number, minimum: -100, maximum: 100}
    MoneyFlowData:
      type: object
      additionalProperties: false
      description: Strict Money Flow presentation projection.
      required:
        - as_of_date
        - generated_at
        - source
        - publishable
        - coverage
        - rows
      properties:
        as_of_date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}(?![\s\S])'
        generated_at:
          type: string
          format: date-time
          minLength: 20
          maxLength: 32
          pattern: '^\d{4}-\d{2}-\d{2}[Tt](?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,6})?(?:[Zz]|[+-](?:[01]\d|2[0-3]):[0-5]\d)(?![\s\S])'
        source:
          type: string
          const: eastmoney_push2his
        publishable:
          type: boolean
        coverage:
          $ref: "#/components/schemas/MoneyFlowCoverage"
        rows:
          type: array
          maxItems: 50000
          items:
            $ref: "#/components/schemas/MoneyFlowRow"
    MoneyFlowCoverage:
      type: object
      additionalProperties: false
      description: Closed producer coverage accounting for one Money Flow snapshot.
      required: [requested, resolved, unavailable, coverage_ratio, min_coverage]
      properties:
        requested:
          type: integer
          minimum: 0
          maximum: 100000
        resolved:
          type: integer
          minimum: 0
          maximum: 100000
        unavailable:
          type: integer
          minimum: 0
          maximum: 100000
        coverage_ratio:
          type: number
          minimum: 0
          maximum: 1
        min_coverage:
          type: number
          minimum: 0
          maximum: 1
    MoneyFlowRow:
      type: object
      additionalProperties: false
      description: Allowlisted daily flow fields used by approved presentation consumers.
      required: [ticker, date, main_net, main_pct, small_net, source]
      properties:
        ticker:
          type: string
          minLength: 1
          maxLength: 15
          pattern: '^[A-Z0-9]+(?:[.-][A-Z0-9]+)*(?![\s\S])'
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}(?![\s\S])'
        main_net:
          anyOf:
            - type: number
              minimum: -1000000000000000
              maximum: 1000000000000000
            - type: "null"
        main_pct:
          anyOf:
            - type: number
              minimum: -1000000
              maximum: 1000000
            - type: "null"
        small_net:
          anyOf:
            - type: number
              minimum: -1000000000000000
              maximum: 1000000000000000
            - type: "null"
        source:
          type: string
          const: eastmoney_push2his
    SectorRotationData:
      type: object
      additionalProperties: false
      description: Strict summary-only Sector Rotation board projection.
      required: [as_of, benchmark, sectors]
      properties:
        as_of:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}(?![\s\S])'
        benchmark:
          type: string
          const: SPY
        sectors:
          type: array
