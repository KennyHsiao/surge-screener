openapi: 3.1.0
info:
  title: Surge Screener API
  version: 1.23.0-draft
  summary: Loopback-only public reads plus protected private operator state.
  description: |
    Contract for the current Phase 1 fixed-artifact reads plus bounded Phase 2
    reads for IV history, the institutional fund catalog, the manually maintained
    AI updates feed, the manually maintained schedule registry, a strict
    Options Flow and candidate feed projections, the strict Crypto Universe,
    Social Intelligence, Theme Flow, Money Flow, Sector Rotation, Daily Summary,
    Playbook Validation, Continuation Validation, COT report catalog/detail, and
    bounded Market Thesis validation/regime-history, Oversold Reversal
    validation, Reversal Radar validation, Knowledge Graph, Watchlist theme
    taxonomy, sector-to-theme drill, and Influencer roster public projections.
    Expected
    artifact failures are represented as HTTP 200 unavailable envelopes so a
    missing or half-written scheduled output cannot crash the frontend. Invalid
    request parameters use sanitized HTTP 422 problem details. Unexpected server
    defects remain HTTP 500.

    Public artifact routes intentionally have no authentication scheme because
    the server is restricted to 127.0.0.1 and exposes bounded non-sensitive
    projections. The private Industry Roles review-board routes additionally
    require a high-entropy Streamlit-to-FastAPI bearer credential. Mutations
    require a strong conditional validator and an idempotency key. That service
    credential is not a human login or a provider token.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:8000
    description: Local FastAPI process
security: []
tags:
  - name: Health
  - name: Candidates
  - name: Signals
  - name: Market Context
  - name: Reports
  - name: Social
  - name: Knowledge
  - name: Watchlists
  - name: Options
  - name: Institutions
  - name: Crypto
  - name: System
  - name: Private
paths:
  /healthz:
    get:
      tags: [Health]
      summary: Check API process health
      description: Artifact absence does not make the process unhealthy.
      operationId: getHealth
      responses:
        "200":
          description: API process is ready to serve requests.
          headers:
            Cache-Control:
              $ref: "#/components/headers/NoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
                apiVersion: v1
  /api/v1/private/industry-roles/review-board:
    get:
      tags: [Private]
      summary: Read the singleton operator's Industry Roles review board
      description: |
        Returns a bounded path-free projection of role names, approved
        assignments, and review suggestions. The bearer credential authenticates
        the Streamlit workload; the private-host perimeter owns the singleton
        human operator boundary.
      operationId: getIndustryRoleReviewBoard
      security:
        - InternalServiceBearer: []
      responses:
        "200":
          $ref: "#/components/responses/IndustryRoleReviewBoardResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
  /api/v1/private/industry-roles/review-board/actions:
    post:
      tags: [Private]
      summary: Mutate the singleton operator's Industry Roles review board
      description: |
        Generates suggestions or approves, rejects, or defers one suggestion.
        Business state, idempotency receipt, and audit row commit as one revision.
      operationId: mutateIndustryRoleReviewBoard
      security:
        - InternalServiceBearer: []
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: string
            minLength: 68
            maxLength: 96
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 16
            maxLength: 128
            pattern: '^[\x21-\x7e]+$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IndustryRoleActionRequest"
      responses:
        "200":
          $ref: "#/components/responses/IndustryRoleMutationResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedProblem"
        "409":
          $ref: "#/components/responses/ConflictProblem"
        "412":
          $ref: "#/components/responses/PreconditionFailedProblem"
        "422":
          $ref: "#/components/responses/UnprocessableProblem"
        "428":
          $ref: "#/components/responses/PreconditionRequiredProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
        "503":
          $ref: "#/components/responses/ServiceUnavailableProblem"
  /api/v1/candidates/ranked:
    get:
      tags: [Candidates]
      summary: Read the ranked candidate artifact
      operationId: getRankedCandidates
      responses:
        "200":
          $ref: "#/components/responses/RankedCandidatesResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/candidates/scored:
    get:
      tags: [Candidates]
      summary: Read the scored candidate artifact
      operationId: getScoredCandidates
      responses:
        "200":
          $ref: "#/components/responses/ScoredCandidatesResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/candidates/ranked/feed:
    get:
      tags: [Candidates]
      summary: Read the strict ranked candidate presentation feed
      operationId: getRankedCandidatesFeed
      responses:
        "200":
          $ref: "#/components/responses/RankedCandidatesFeedResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/candidates/scored/feed:
    get:
      tags: [Candidates]
      summary: Read the strict scored candidate presentation feed
      operationId: getScoredCandidatesFeed
      responses:
        "200":
          $ref: "#/components/responses/ScoredCandidatesFeedResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/candidates/scored/screener:
    get:
      tags: [Candidates]
      summary: Read the strict US Screener scored projection
      operationId: getScoredCandidatesScreener
      responses:
        "200":
          $ref: "#/components/responses/ScoredCandidatesScreenerResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/crypto/universe:
    get:
      tags: [Crypto]
      summary: Read the Binance USDT perpetual universe
      description: |
        Reads one fixed server-owned snapshot. The strict public projection omits
        provider failure diagnostics and duplicate symbol storage; TradingView
        export rows are derived by the frontend from validated `tv_symbol` values.
      operationId: getCryptoUniverse
      responses:
        "200":
          $ref: "#/components/responses/CryptoUniverseResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/signals/options-flow/latest:
    get:
      tags: [Signals]
      summary: Read the latest options-flow snapshot
      operationId: getLatestOptionsFlow
      responses:
        "200":
          $ref: "#/components/responses/OptionsFlowResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/signals/options-flow/feed:
    get:
      tags: [Signals]
      summary: Read the strict Options Flow feed projection
      description: |
        Reads the fixed Options Flow artifact and returns only the bounded,
        allowlisted fields used by frontend consumers. Expected artifact
        failures return an HTTP 200 unavailable envelope.
      operationId: getOptionsFlowFeed
      responses:
        "200":
          $ref: "#/components/responses/OptionsFlowFeedResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/signals/reversal-radar/latest:
    get:
      tags: [Signals]
      summary: Read the latest reversal-radar snapshot
      description: >-
        Returns only bounded persisted discovery provenance and unique ticker
        references. Live Reversal detail is recomputed by the backend provider
        path and is not published by this projection.
      operationId: getLatestReversalRadar
      responses:
        "200":
          $ref: "#/components/responses/ReversalRadarResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/signals/reversal-radar/validation:
    get:
      tags: [Signals]
      summary: Read the Reversal Radar forward-validation summary
      description: >-
        Returns only the bounded conservative maturity headline and three fixed
        tier hit-rate rows. EV, excess-return statistics, equity curves,
        survivorship, and producer diagnostics remain server-side.
      operationId: getReversalRadarValidation
      responses:
        "200":
          $ref: "#/components/responses/ReversalRadarValidationResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/signals/oversold-reversal/latest:
    get:
      tags: [Signals]
      summary: Read the latest oversold-reversal snapshot
      description: >-
        Returns the strict bounded coiled-base presentation projection while
        excluding source diagnostics and unused candidate fields.
      operationId: getLatestOversoldReversal
      responses:
        "200":
          $ref: "#/components/responses/OversoldReversalResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/signals/oversold-reversal/validation:
    get:
      tags: [Signals]
      summary: Read the Oversold Reversal forward-validation summary
      description: >-
        Returns only the bounded conservative maturity headline and three fixed
        tier hit-rate rows. EV, equity curves, survivorship, cohort, cost, and
        producer diagnostics remain server-side.
      operationId: getOversoldReversalValidation
      responses:
        "200":
          $ref: "#/components/responses/OversoldReversalValidationResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/market-context/market-thesis/latest:
    get:
      tags: [Market Context]
      summary: Read the latest Market Thesis forecast
      description: >-
        Resolves the latest forecast by date with ready-over-regime-only
        same-day precedence and returns only the strict public presentation
        projection. Expected artifact failures return an HTTP 200 unavailable
        envelope.
      description: |
        Resolves only server-known Market Thesis forecast files. When multiple
        files exist for one day, a ready forecast has precedence over a
        regime-only forecast.
      operationId: getLatestMarketThesis
      responses:
        "200":
          $ref: "#/components/responses/MarketThesisResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/reports/daily-summary/latest:
    get:
      tags: [Reports]
      summary: Read the latest dated Daily Summary
      description: >-
        Selects only the newest exact real-date report directory and returns a
        strict minimal regime and candidate-reference projection. The selected
        source date must match its directory; expected artifact failures return
        an HTTP 200 unavailable envelope without older fallback.
      operationId: getLatestDailySummary
      responses:
        "200":
          $ref: "#/components/responses/DailySummaryResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/reports/playbook-validation/latest:
    get:
      tags: [Reports]
      summary: Read the latest Playbook Validation presentation summary
      description: >-
        Reads one fixed server-owned summary and returns only bounded maturity,
        decision-count, playbook, and factor presentation fields. Raw blocked
        diagnostics, outcome counts, decision snapshots, ticker outcomes,
        provider details, and source paths remain server-side.
      operationId: getLatestPlaybookValidation
      responses:
        "200":
          $ref: "#/components/responses/PlaybookValidationResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/reports/continuation-validation/latest:
    get:
      tags: [Reports]
      summary: Read the latest Continuation Validation presentation
      description: >-
        Reads one fixed server-owned validation artifact and returns the bounded
        maturity summary and displayed ticker outcomes. Private blocked reasons,
        producer notes, feature corpora, provider details, and paths remain
        server-side.
      operationId: getLatestContinuationValidation
      responses:
        "200":
          $ref: "#/components/responses/ContinuationValidationResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/reports/cot:
    get:
      tags: [Reports]
      summary: Enumerate published COT report dates
      description: >-
        Enumerates only bounded, exact real-date Markdown publication names from
        the fixed server-owned COT directory. Paths, errors, prompts, providers,
        and generation state are not exposed.
      operationId: getCotReportCatalog
      responses:
        "200":
          $ref: "#/components/responses/CotCatalogResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/reports/cot/{report_date}:
    get:
      tags: [Reports]
      summary: Read one published COT report pair
      description: >-
        Reads one server-enumerated real-date Markdown/verified-JSON pair and
        returns a strict bounded presentation. Missing or invalid pairs do not
        fall back to another report date.
      operationId: getCotReport
      parameters:
        - name: report_date
          in: path
          required: true
          description: Exact published COT Friday date.
          schema:
            type: string
            format: date
            minLength: 10
            maxLength: 10
            pattern: '^\d{4}-\d{2}-\d{2}(?![\s\S])'
      responses:
        "200":
          $ref: "#/components/responses/CotDetailResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/market-context/market-thesis/validation:
    get:
      tags: [Market Context]
      summary: Read the Market Thesis forward-validation summary
      description: >-
        Returns only bounded publishability counters and full-key hit-rate rows.
        Rejected ledgers, invalid records, benchmark configuration, and notes
        remain server-side.
      operationId: getMarketThesisValidation
      responses:
        "200":
          $ref: "#/components/responses/MarketThesisValidationResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/market-context/market-thesis/regime-history:
    get:
      tags: [Market Context]
      summary: Read the Market Thesis regime-history summary
      description: >-
        Projects exactly three regimes and three forward windows. The raw daily
        corpus, runs, episodes, rules, VIX telemetry, and notes never enter the
        response.
      operationId: getMarketThesisRegimeHistory
      responses:
        "200":
          $ref: "#/components/responses/MarketThesisRegimeHistoryResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/market-context/money-flow/latest:
    get:
      tags: [Market Context]
      summary: Read the latest strict Money Flow snapshot
      description: |
        Returns the bounded allowlisted Eastmoney presentation projection.
        Provider identifiers, raw rows, and unused flow breakdowns remain
        server-side.
      operationId: getLatestMoneyFlow
      responses:
        "200":
          $ref: "#/components/responses/MoneyFlowResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/market-context/sector-rotation/latest:
    get:
      tags: [Market Context]
      summary: Read the latest strict Sector Rotation board
      description: |
        Resolves only the newest exact dated server archive and returns the
        closed quantitative presentation board. Macro context, leader lists,
        AI read, producer status, and live providers remain server-side.
      operationId: getLatestSectorRotation
      responses:
        "200":
          $ref: "#/components/responses/SectorRotationResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/market-context/theme-drill:
    get:
      tags: [Market Context]
      summary: Read the fixed sector-to-theme drill projection
      description: Projects only theme names and parent SPDR sector ETFs from the fixed basket curation; ticker membership and producer details are omitted.
      operationId: getThemeDrill
      responses:
        "200":
          $ref: "#/components/responses/ThemeDrillResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/knowledge/graph:
    get:
      tags: [Knowledge]
      summary: Read the bounded public Knowledge Graph
      description: Compiles the fixed vault once and returns only the bounded path-free graph projection.
      operationId: getKnowledgeGraph
      responses:
        "200":
          $ref: "#/components/responses/KnowledgeGraphResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/watchlists/theme-taxonomy:
    get:
      tags: [Watchlists]
      summary: Read the public Watchlist theme taxonomy
      operationId: getThemeTaxonomy
      responses:
        "200":
          $ref: "#/components/responses/ThemeTaxonomyResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/social/influencers:
    get:
      tags: [Social]
      summary: Read the public Influencer roster projection
      description: Reads the fixed editable roster without seeding, writing, paths, or provider state.
      operationId: getInfluencerRoster
      responses:
        "200":
          $ref: "#/components/responses/InfluencerRosterResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/social/intelligence/latest:
    get:
      tags: [Social]
      summary: Read the latest Social Intelligence snapshot
      description: |
        Returns only bounded persisted radar and local-summary fields. Live X,
        Agent Reach, roster, and AI actions are not invoked.
      operationId: getLatestSocialIntelligence
      responses:
        "200":
          $ref: "#/components/responses/SocialIntelligenceResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/market-context/theme-flow/latest:
    get:
      tags: [Market Context]
      summary: Read the latest Theme Flow board
      description: |
        Returns the strict current-schema presentation board and its
        server-computed coherence fingerprint without running providers.
      operationId: getLatestThemeFlow
      responses:
        "200":
          $ref: "#/components/responses/ThemeFlowResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/market-context/theme-flow/analysis:
    get:
      tags: [Market Context]
      summary: Read the current-validation Theme Flow analysis
      description: |
        Returns only a ready validation-v8 persisted read. The frontend compares
        its board fingerprint with the displayed Theme Flow board.
      operationId: getThemeFlowAnalysis
      responses:
        "200":
          $ref: "#/components/responses/ThemeFlowAnalysisResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/options/iv-history/{ticker}:
    get:
      tags: [Options]
      summary: Read one ticker's IV history
      description: |
        The ticker is a bounded business identifier, never a filename or path.
        Lowercase input is normalized to uppercase. Expected artifact failures
        still return HTTP 200 unavailable envelopes.
      operationId: getIvHistory
      parameters:
        - name: ticker
          in: path
          required: true
          description: US ticker using ASCII alphanumeric groups separated by `.` or `-`.
          schema:
            type: string
            minLength: 1
            maxLength: 15
            pattern: "^[A-Za-z0-9]+(?:[.-][A-Za-z0-9]+)*$"
      responses:
        "200":
          $ref: "#/components/responses/IvHistoryResponse"
        "422":
          $ref: "#/components/responses/ValidationProblem"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/institutions/funds:
    get:
      tags: [Institutions]
      summary: Read the curated institutional fund catalog
      description: |
        Reads only the server-owned `content/funds.json` catalog. The response
        contains public display names, SEC CIK strings, and notes; repository
        maintainer guidance such as the source `_note` is validated but omitted.
        This operation never calls EDGAR or returns live holdings.
      operationId: getInstitutionFunds
      responses:
        "200":
          $ref: "#/components/responses/FundCatalogResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/system/ai-updates:
    get:
      tags: [System]
      summary: Read the manually maintained AI updates feed
      description: |
        Reads only the server-owned content/ai_updates.json feed. Maintainer-only
        source guidance is validated but omitted from the public response. Update
        order and all public string values are preserved exactly. This operation
        has no parameters and never calls an AI or network provider.
      operationId: getAiUpdates
      responses:
        "200":
          $ref: "#/components/responses/AiUpdatesResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
  /api/v1/system/schedules:
    get:
      tags: [System]
      summary: Read the manually maintained schedule registry
      description: |
        Reads only the server-owned `content/schedules.json` registry. Maintainer
        guidance such as the source `_note` is validated but omitted. Schedule
        order and all public string values are preserved exactly. This operation
        has no parameters and never reads result artifacts or calls a provider.
      operationId: getSchedules
      responses:
        "200":
          $ref: "#/components/responses/SchedulesResponse"
        "500":
          $ref: "#/components/responses/InternalProblem"
components:
  securitySchemes:
    InternalServiceBearer:
      type: http
      scheme: bearer
      description: |
        High-entropy Streamlit-to-FastAPI service credential for protected
        loopback routes; not a human login or provider token.
  headers:
    NoStore:
      description: Prevent browsers and intermediaries from retaining artifact state.
      schema:
        type: string
        const: no-store
    StrongETag:
      description: Strong validator for the complete Industry Roles review state.
      schema:
        type: string
        minLength: 68
        maxLength: 96
  responses:
    IndustryRoleReviewBoardResponse:
      description: Current protected review-board projection or fail-soft source state.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/StrongETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustryRoleReviewBoardEnvelope"
    IndustryRoleMutationResponse:
      description: Committed or durably replayed Industry Roles action.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        ETag:
          $ref: "#/components/headers/StrongETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/IndustryRoleMutationResult"
    UnauthorizedProblem:
      description: Missing or invalid internal service credential.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailableProblem:
      description: Internal service credential is not configured.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ConflictProblem:
      description: Domain conflict or idempotency-key reuse with another request.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailedProblem:
      description: The supplied strong validator is stale or invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableProblem:
      description: The action body or required header value is invalid.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequiredProblem:
      description: If-Match or Idempotency-Key is missing.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RankedCandidatesResponse:
      description: |
        Ranked candidate artifact state. Expected artifact failures still use
        HTTP 200 with `available=false`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RankedCandidatesEnvelope"
    ScoredCandidatesResponse:
      description: Scored candidate artifact state.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScoredCandidatesEnvelope"
    RankedCandidatesFeedResponse:
      description: Strict bounded ranked candidate presentation state.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RankedCandidatesFeedEnvelope"
    ScoredCandidatesFeedResponse:
      description: Strict bounded scored candidate presentation state.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScoredCandidatesFeedEnvelope"
    ScoredCandidatesScreenerResponse:
      description: Strict bounded US Screener scored state.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ScoredCandidatesScreenerEnvelope"
    CryptoUniverseResponse:
      description: |
        Strict Binance USDT perpetual snapshot state. Expected artifact failures
        still use HTTP 200 with `available=false`.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CryptoUniverseEnvelope"
    OptionsFlowResponse:
      description: Latest options-flow artifact state.
      headers:
        Cache-Control:
          $ref: "#/components/headers/NoStore"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OptionsFlowEnvelope"
    OptionsFlowFeedResponse:
      description: |
