    CryptoUniverseData:
      type: object
      description: |
        Strict public projection of the Binance USDT perpetual universe. Runtime
        validation additionally enforces sorted unique symbols, count equality,
        diff consistency, provenance ordering, and source-status/stale invariants.
      additionalProperties: false
      required:
        - date
        - source
        - source_status
        - stale
        - stale_source_date
        - count
        - universe
        - added
        - removed
        - compared_to
      properties:
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
        source:
          type: string
          const: binance_fapi_exchangeInfo
        source_status:
          type: string
          enum: [live, stale_fallback, unavailable]
        stale:
          type: boolean
        stale_source_date:
          anyOf:
            - type: string
              format: date
              pattern: '^\d{4}-\d{2}-\d{2}$'
            - type: "null"
        count:
          type: integer
          minimum: 0
          maximum: 2000
        universe:
          type: array
          maxItems: 2000
          items:
            $ref: "#/components/schemas/CryptoUniverseItem"
        added:
          type: array
          maxItems: 2000
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 30
            pattern: '^[^\s\x00-\x1f\x7f:./\\]{2,30}$'
        removed:
          type: array
          maxItems: 2000
          uniqueItems: true
          items:
            type: string
            minLength: 2
            maxLength: 30
            pattern: '^[^\s\x00-\x1f\x7f:./\\]{2,30}$'
        compared_to:
          anyOf:
            - type: string
              format: date
              pattern: '^\d{4}-\d{2}-\d{2}$'
            - type: "null"
    CryptoUniverseItem:
      type: object
      additionalProperties: false
      required: [symbol, base, tv_symbol, onboard_date]
      properties:
        symbol:
          type: string
          minLength: 2
          maxLength: 30
          pattern: '^[^\s\x00-\x1f\x7f:./\\]{2,30}$'
        base:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^[^\s\x00-\x1f\x7f:./\\]{1,30}$'
        tv_symbol:
          type: string
          minLength: 12
          maxLength: 40
          pattern: '^BINANCE:[^\s\x00-\x1f\x7f:./\\]{2,30}\.P$'
        onboard_date:
          anyOf:
            - type: string
              format: date
              pattern: '^\d{4}-\d{2}-\d{2}$'
            - type: "null"
    OptionsFlowData:
      type: object
      required: [signals]
      properties:
        signals:
          $ref: "#/components/schemas/ObjectList"
      additionalProperties: true
    OptionsFlowFeedData:
      type: object
      description: |
        Strict public feed projection. Runtime validation additionally requires
        unique ticker keys, non-increasing flow scores,
        `len(signals) <= signal_count <= universe_size`, and metadata timestamps
        that represent the same instant as `generated_at`; those cross-field
        invariants cannot be expressed by JSON Schema `uniqueItems`.
      additionalProperties: false
      required:
        - generated_at
        - as_of
        - provider
        - universe_size
        - min_notional
        - signal_count
        - signals
      properties:
        generated_at:
          type: string
          format: date-time
          minLength: 20
          maxLength: 32
          pattern: '^\d{4}-\d{2}-\d{2}[Tt](?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d{1,6})?(?:[Zz]|[+-](?:[01]\d|2[0-3]):[0-5]\d)(?![\s\S])'
          description: Preserved source spelling; metadata may serialize the same UTC instant using Z.
        as_of:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}(?![\s\S])'
        provider:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*(?![\s\S])'
        universe_size:
          type: integer
          minimum: 0
          maximum: 10000
        min_notional:
          type: integer
          minimum: 1
          maximum: 1000000000000
        signal_count:
          type: integer
          minimum: 0
          maximum: 10000
        signals:
          type: array
          minItems: 0
          maxItems: 200
          description: Source-ordered signals; ticker-key uniqueness and score order are runtime invariants.
          items:
            $ref: "#/components/schemas/OptionsFlowFeedSignal"
    OptionsFlowFeedSignal:
      type: object
      additionalProperties: false
      required:
        - ticker
        - direction
        - flow_score
        - est_notional_usd
        - biggest
        - expiry
        - max_voi
        - high_voi_strikes
        - call_put_ratio
        - put_call_ratio
        - tags
      properties:
        ticker:
          type: string
          minLength: 1
          maxLength: 15
          pattern: '^[A-Z0-9]+(?:[.-][A-Z0-9]+)*(?![\s\S])'
        direction:
          type: string
          enum: [bullish, bearish]
        flow_score:
          type: number
          minimum: 0
          maximum: 100
        est_notional_usd:
          type: integer
          minimum: 1
          maximum: 1000000000000000
        biggest:
          anyOf:
            - $ref: "#/components/schemas/OptionsFlowFeedBiggest"
            - type: "null"
        expiry:
          anyOf:
            - type: string
              format: date
              pattern: '^\d{4}-\d{2}-\d{2}(?![\s\S])'
            - type: "null"
        max_voi:
          type: number
          minimum: 0
          maximum: 1000000000
        high_voi_strikes:
          type: integer
          minimum: 0
          maximum: 100000
        call_put_ratio:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1000000000
            - type: "null"
        put_call_ratio:
          anyOf:
            - type: number
              minimum: 0
              maximum: 1000000000
            - type: "null"
        tags:
          type: array
          minItems: 0
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 100
            pattern: '^\S(?:[\s\S]*\S)?(?![\s\S])'
    OptionsFlowFeedBiggest:
      type: object
      additionalProperties: false
      required: [strike, notional]
      properties:
        strike:
          anyOf:
            - type: number
              exclusiveMinimum: 0
            - type: "null"
        notional:
