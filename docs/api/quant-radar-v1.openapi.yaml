        rs_ratio:
          type: number
          minimum: 0
          maximum: 500
        rs_momentum:
          type: number
          minimum: 0
          maximum: 500
        heat_score:
          type: number
          minimum: 0
          maximum: 100
        ret_5d:
          type: number
          minimum: -100
          maximum: 1000
        ret_20d:
          type: number
          minimum: -100
          maximum: 1000
        ret_60d:
          type: number
          minimum: -100
          maximum: 1000
        excess_20d:
          type: number
          minimum: -1000
          maximum: 1000
        pct_vs_ma50:
          type: number
          minimum: -100
          maximum: 1000
        pct_vs_ma200:
          type: number
          minimum: -100
          maximum: 1000
        pct_from_52w_high:
          type: number
          minimum: -100
          maximum: 1000
        rvol:
          type: number
          minimum: 0
          maximum: 1000
